name: CI & Security Audit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-audit:
    name: Build & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Secret Exclusion (.env protection)
        run: |
          if [ -f .env.local ]; then
            echo "SECURITY ERROR: .env.local must never be committed to git!"
            exit 1
          fi
          echo "No .env.local detected in repository. Credentials are safe."

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Production Build Test
        run: npm run build
